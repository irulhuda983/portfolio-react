<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="AI Training Partner">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a" />
      <stop offset="100%" stop-color="#111a2b" />
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="400" height="225" fill="url(#bg1)" />

  <!-- subtle dot grid -->
  <g fill="#1e293b">
    <circle cx="20" cy="20" r="1.4" /><circle cx="50" cy="20" r="1.4" /><circle cx="80" cy="20" r="1.4" />
    <circle cx="320" cy="20" r="1.4" /><circle cx="350" cy="20" r="1.4" /><circle cx="380" cy="20" r="1.4" />
    <circle cx="20" cy="205" r="1.4" /><circle cx="50" cy="205" r="1.4" /><circle cx="80" cy="205" r="1.4" />
    <circle cx="320" cy="205" r="1.4" /><circle cx="350" cy="205" r="1.4" /><circle cx="380" cy="205" r="1.4" />
  </g>

  <circle cx="200" cy="95" r="90" fill="url(#orb1)" />

  <!-- avatar / interview subject -->
  <circle cx="200" cy="80" r="26" fill="none" stroke="#2dd4bf" stroke-width="2.5" />
  <circle cx="200" cy="72" r="9" fill="#2dd4bf" />
  <path d="M180 96 a20 16 0 0 1 40 0" fill="#2dd4bf" />

  <!-- concentric AI rings -->
  <circle cx="200" cy="80" r="42" fill="none" stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="200" cy="80" r="58" fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- waveform (video/audio interview) -->
  <g stroke="#5eead4" stroke-width="3" stroke-linecap="round">
    <line x1="130" y1="165" x2="130" y2="155" />
    <line x1="145" y1="165" x2="145" y2="145" />
    <line x1="160" y1="165" x2="160" y2="150" />
    <line x1="175" y1="165" x2="175" y2="135" />
    <line x1="190" y1="165" x2="190" y2="150" />
    <line x1="205" y1="165" x2="205" y2="140" />
    <line x1="220" y1="165" x2="220" y2="155" />
    <line x1="235" y1="165" x2="235" y2="145" />
    <line x1="250" y1="165" x2="250" y2="150" />
    <line x1="265" y1="165" x2="265" y2="158" />
    <line x1="270" y1="165" x2="270" y2="160" />
  </g>

  <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#94a3b8" letter-spacing="1">AI TRAINING PARTNER</text>
</svg>
