<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img" aria-label="AI Training Partner Admin Dashboard">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a" />
      <stop offset="100%" stop-color="#111a2b" />
    </linearGradient>
  </defs>

  <rect width="400" height="225" fill="url(#bg2)" />

  <!-- subtle dot grid -->
  <g fill="#1e293b">
    <circle cx="20" cy="20" r="1.4" /><circle cx="50" cy="20" r="1.4" /><circle cx="80" cy="20" r="1.4" />
    <circle cx="320" cy="20" r="1.4" /><circle cx="350" cy="20" r="1.4" /><circle cx="380" cy="20" r="1.4" />
    <circle cx="20" cy="205" r="1.4" /><circle cx="50" cy="205" r="1.4" /><circle cx="80" cy="205" r="1.4" />
    <circle cx="320" cy="205" r="1.4" /><circle cx="350" cy="205" r="1.4" /><circle cx="380" cy="205" r="1.4" />
  </g>

  <!-- dashboard panel -->
  <rect x="75" y="45" width="250" height="115" rx="8" fill="#0f1626" stroke="#243049" stroke-width="1.5" />

  <!-- side nav -->
  <rect x="87" y="57" width="45" height="91" rx="4" fill="#141d31" />
  <rect x="95" y="67" width="29" height="4" rx="2" fill="#2dd4bf" />
  <rect x="95" y="80" width="29" height="4" rx="2" fill="#334155" />
  <rect x="95" y="93" width="29" height="4" rx="2" fill="#334155" />
  <rect x="95" y="106" width="29" height="4" rx="2" fill="#334155" />

  <!-- bar chart -->
  <g fill="#2dd4bf">
    <rect x="150" y="118" width="14" height="30" rx="2" opacity="0.55" />
    <rect x="172" y="100" width="14" height="48" rx="2" opacity="0.75" />
    <rect x="194" y="112" width="14" height="36" rx="2" opacity="0.6" />
    <rect x="216" y="90" width="14" height="58" rx="2" />
  </g>

  <!-- shield / access control icon -->
  <g transform="translate(268,90)">
    <path d="M20 0 L38 7 V22 C38 34 30 42 20 46 C10 42 2 34 2 22 V7 Z" fill="#0f1626" stroke="#2dd4bf" stroke-width="2.5" />
    <path d="M11 22 L17 28 L29 15" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <text x="200" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#94a3b8" letter-spacing="1">ADMIN DASHBOARD</text>
</svg>
